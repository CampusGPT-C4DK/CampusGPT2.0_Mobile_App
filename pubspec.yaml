name: campusgpt_app
description: A beautiful Campus AI Assistant mobile app for students.

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.5
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.1
  url_launcher: ^6.1.0

  # Authentication
  jwt_decoder: ^2.0.1

  # UI & Navigation
  go_router: ^12.0.0

  # Local Storage
  shared_preferences: ^2.2.0

  # Utilities
  intl: ^0.18.1
  uuid: ^4.0.0
  logging: ^1.2.0
  app_links: ^3.4.5
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  syncfusion_flutter_pdfviewer: ^31.1.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

